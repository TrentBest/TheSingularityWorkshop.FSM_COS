<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="asset-title asset-desc">
<title id="asset-title">FSM_COS AI capability composition</title>
<desc id="asset-desc">Conceptual diagram showing AI-related capabilities as composable bundles around FSM_COS rather than built into the composition kernel. The moving connector is illustrative, not live runtime telemetry; animation is disabled for reduced-motion preferences.</desc>
<defs><marker id="composition-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#83f0bd"/></marker></defs>
<style>
  .handoff { stroke-dasharray: 7 9; animation: handoff-flow 3s linear infinite; }
  .kernel-pulse { transform-box: fill-box; transform-origin: center; animation: kernel-breathe 4.5s ease-in-out infinite; }
  @keyframes handoff-flow { to { stroke-dashoffset: -64; } }
  @keyframes kernel-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }
  @media (prefers-reduced-motion: reduce) { .handoff, .kernel-pulse { animation: none; } }
</style>
<rect width="1200" height="650" rx="32" fill="#0b0f16"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<text x="600" y="55" fill="white" font-size="30" font-weight="700">FSM_COS — AI Capabilities as Composition</text>
<rect x="80" y="115" width="220" height="100" rx="18" fill="#141b27" stroke="#8bd5ff" stroke-width="2"/>
<text x="190" y="155" fill="#8bd5ff" font-size="24" font-weight="700">ProtocolAI</text><text x="190" y="187" fill="white" font-size="17">WHAT</text>
<rect x="340" y="115" width="220" height="100" rx="18" fill="#141b27" stroke="#b8a7ff" stroke-width="2"/>
<text x="450" y="155" fill="#b8a7ff" font-size="24" font-weight="700">GrammarAI</text><text x="450" y="187" fill="white" font-size="17">HOW</text>
<rect x="640" y="115" width="220" height="100" rx="18" fill="#141b27" stroke="#83f0bd" stroke-width="2"/>
<text x="750" y="155" fill="#83f0bd" font-size="24" font-weight="700">AI Exchange</text><text x="750" y="187" fill="white" font-size="17">context / request</text>
<rect x="900" y="115" width="220" height="100" rx="18" fill="#141b27" stroke="#ffd37d" stroke-width="2"/>
<text x="1010" y="155" fill="#ffd37d" font-size="24" font-weight="700">Provider</text><text x="1010" y="187" fill="white" font-size="17">transport</text>
<path class="handoff" d="M300 165 H340 M560 165 H640 M860 165 H900" stroke="white" stroke-width="3"/>
<path class="handoff" d="M190 215 V305 M450 215 V305 M750 215 V305 M1010 215 V305" fill="none" stroke="#83f0bd" stroke-width="2.5" marker-end="url(#composition-arrow)"/>
<rect class="kernel-pulse" x="190" y="320" width="820" height="160" rx="24" fill="#111923" stroke="#d9e1eb" stroke-width="2"/>
<text x="600" y="360" fill="white" font-size="23" font-weight="700">FSM_COS</text>
<text x="600" y="395" fill="#b9c5d6" font-size="18">resolve → dependency closure → load → arbitrate → converge</text>
<text x="600" y="430" fill="#b9c5d6" font-size="18">AI capabilities become part of a stable RuntimeAssembly</text>
<text x="600" y="458" fill="#83f0bd" font-size="16">The kernel assembles them; the host executes them.</text>
<rect x="335" y="540" width="530" height="65" rx="18" fill="#18231e" stroke="#83f0bd" stroke-width="2"/>
<text x="600" y="580" fill="white" font-size="20" font-weight="700">RuntimeAssembly → Host / Experience</text>
</g>
</svg>