<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b12"/><stop offset="1" stop-color="#111b25"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<g opacity=".14" stroke="#63e6ff"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200"/><path d="M100 0V560M200 0V560M300 0V560M400 0V560M500 0V560M600 0V560M700 0V560M800 0V560M900 0V560M1000 0V560M1100 0V560"/></g>
<text x="60" y="58" fill="#63e6ff" font-family="monospace" font-size="26" letter-spacing="4">THE COMPOSITION BOUNDARY</text>
<text x="60" y="86" fill="#8da6b8" font-family="monospace" font-size="13">WHAT CROSSES INTO FSM_COS — AND WHAT MUST STAY OUT</text>

<g transform="translate(65 145)">
  <rect width="300" height="285" rx="14" fill="#0d1822" stroke="#2a5266" stroke-width="2"/>
  <text x="150" y="38" text-anchor="middle" fill="#f2f7fa" font-family="monospace" font-size="18">INPUT</text>
  <text x="25" y="78" fill="#63e6ff" font-family="monospace" font-size="14">RuntimeManifest</text>
  <text x="25" y="111" fill="#8da6b8" font-family="monospace" font-size="12">runtime identity</text>
  <text x="25" y="135" fill="#8da6b8" font-family="monospace" font-size="12">root IDs + requested versions</text>
  <text x="25" y="159" fill="#8da6b8" font-family="monospace" font-size="12">optional intent / plan metadata</text>
  <line x1="25" y1="184" x2="275" y2="184" stroke="#294a5c"/>
  <text x="25" y="214" fill="#f5c76a" font-family="monospace" font-size="13">Catalog + config source</text>
  <text x="25" y="238" fill="#8da6b8" font-family="monospace" font-size="12">host-supplied boundaries</text>
  <text x="25" y="262" fill="#8da6b8" font-family="monospace" font-size="12">resolve bundles / provide config</text>
</g>

<path d="M365 286H455" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>

<g transform="translate(455 115)">
  <rect width="290" height="345" rx="18" fill="#0b141d" stroke="#63e6ff" stroke-width="3"/>
  <text x="145" y="48" text-anchor="middle" fill="#63e6ff" font-family="monospace" font-size="22" letter-spacing="3">FSM_COS</text>
  <text x="145" y="82" text-anchor="middle" fill="#f2f7fa" font-family="monospace" font-size="16">OWNS COMPOSITION</text>
  <g font-family="monospace" font-size="13">
    <text x="30" y="125" fill="#d7e3ea">dependency closure</text>
    <text x="30" y="155" fill="#d7e3ea">configured loading</text>
    <text x="30" y="185" fill="#d7e3ea">cycle detection</text>
    <text x="30" y="215" fill="#d7e3ea">arbitration</text>
    <text x="30" y="245" fill="#d7e3ea">convergence</text>
    <text x="30" y="275" fill="#d7e3ea">RuntimeAssembly</text>
  </g>
  <circle cx="248" cy="125" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="248" cy="155" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="248" cy="185" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="248" cy="215" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="248" cy="245" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="248" cy="275" r="7" fill="#ffd166" filter="url(#glow)"/>
  <rect x="30" y="300" width="230" height="28" rx="6" fill="#111e29" stroke="#294a5c"/>
  <text x="145" y="319" text-anchor="middle" fill="#f5c76a" font-family="monospace" font-size="11">ASSEMBLE — THEN STOP</text>
</g>

<path d="M745 286H835" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>

<g transform="translate(835 145)">
  <rect width="300" height="285" rx="14" fill="#0d1822" stroke="#2a5266" stroke-width="2"/>
  <text x="150" y="38" text-anchor="middle" fill="#f2f7fa" font-family="monospace" font-size="18">OUTSIDE</text>
  <text x="25" y="80" fill="#63e6ff" font-family="monospace" font-size="14">RuntimeAssembly</text>
  <text x="25" y="112" fill="#8da6b8" font-family="monospace" font-size="12">host execution</text>
  <text x="25" y="136" fill="#8da6b8" font-family="monospace" font-size="12">GUI / browser lifecycle</text>
  <text x="25" y="160" fill="#8da6b8" font-family="monospace" font-size="12">Unity / desktop lifecycle</text>
  <text x="25" y="184" fill="#8da6b8" font-family="monospace" font-size="12">Experience presentation</text>
  <line x1="25" y1="207" x2="275" y2="207" stroke="#294a5c"/>
  <text x="25" y="237" fill="#f5c76a" font-family="monospace" font-size="13">FSM_Serialization</text>
  <text x="25" y="261" fill="#8da6b8" font-family="monospace" font-size="12">owns the byte boundary</text>
</g>

<text x="600" y="515" text-anchor="middle" fill="#f5c76a" font-family="monospace" font-size="15">FSM_COS IS A BOUNDARY OF RESPONSIBILITY, NOT A GENERAL APPLICATION FRAMEWORK.</text>
</svg>