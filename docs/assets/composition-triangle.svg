<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
  <title id="title">FSM_COS composition triangle</title>
  <desc id="desc">RuntimeManifest request flows into FSM_COS composition and produces RuntimeAssembly for a host. The catalog is an external input boundary. The host owns execution and manifestation.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182a3a"/>
      <stop offset="1" stop-color="#243e52"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d2e8f4"/>
    </marker>
    <style>
      .heading{font:700 24px system-ui,sans-serif;fill:#f4f8fb}
      .label{font:700 20px system-ui,sans-serif;fill:#f4f8fb}
      .sub{font:16px system-ui,sans-serif;fill:#d4e2ec}
      .outer{fill:none;stroke:#8bb8d0;stroke-width:3}
      .flow{fill:none;stroke:#d2e8f4;stroke-width:3;marker-end:url(#arrow)}
      .note{font:16px system-ui,sans-serif;fill:#243746}
    </style>
  </defs>
  <rect width="900" height="660" rx="24" fill="#f4f7fa"/>
  <text x="450" y="44" text-anchor="middle" class="heading" fill="#243746" style="fill:#243746">FSM_COS · THE COMPOSITION TRIANGLE</text>
  <path class="outer" d="M450 110 L170 470 L730 470 Z"/>
  <rect x="310" y="78" width="280" height="82" rx="14" fill="url(#panel)"/>
  <text x="450" y="111" text-anchor="middle" class="label">REQUEST</text>
  <text x="450" y="137" text-anchor="middle" class="sub">RuntimeManifest</text>
  <rect x="58" y="422" width="250" height="96" rx="14" fill="url(#panel)"/>
  <text x="183" y="458" text-anchor="middle" class="label">COMPOSITION</text>
  <text x="183" y="486" text-anchor="middle" class="sub">FSM_COS</text>
  <rect x="592" y="422" width="250" height="96" rx="14" fill="url(#panel)"/>
  <text x="717" y="458" text-anchor="middle" class="label">HANDOFF</text>
  <text x="717" y="486" text-anchor="middle" class="sub">RuntimeAssembly</text>
  <path class="flow" d="M355 160 L245 386"/>
  <path class="flow" d="M545 160 L655 386"/>
  <path class="flow" d="M310 470 L582 470"/>
  <rect x="342" y="265" width="216" height="94" rx="14" fill="#e0edf4" stroke="#8bb8d0" stroke-width="2"/>
  <text x="450" y="296" text-anchor="middle" style="font:700 18px system-ui,sans-serif;fill:#243746">STABLE RESULT</text>
  <text x="450" y="322" text-anchor="middle" style="font:15px system-ui,sans-serif;fill:#243746">resolve · load</text>
  <text x="450" y="343" text-anchor="middle" style="font:15px system-ui,sans-serif;fill:#243746">arbitrate · converge</text>
  <rect x="60" y="555" width="330" height="70" rx="12" fill="#fff" stroke="#9aafbd" stroke-width="2"/>
  <text x="225" y="583" text-anchor="middle" style="font:700 17px system-ui,sans-serif;fill:#243746">EXTERNAL INPUT</text>
  <text x="225" y="605" text-anchor="middle" style="font:15px system-ui,sans-serif;fill:#425968">Catalog / resolver</text>
  <rect x="510" y="555" width="330" height="70" rx="12" fill="#fff" stroke="#9aafbd" stroke-width="2"/>
  <text x="675" y="583" text-anchor="middle" style="font:700 17px system-ui,sans-serif;fill:#243746">OUTSIDE THE KERNEL</text>
  <text x="675" y="605" text-anchor="middle" style="font:15px system-ui,sans-serif;fill:#425968">Host executes / manifests</text>
</svg>