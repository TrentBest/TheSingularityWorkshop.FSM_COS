<svg width="1600" height="900" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="FSM_COS validation and composition path" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">FSM_COS validation and composition path</title><desc id="gui-svg-description">Generated with GUI.SVG from a controlled scene. Shows full dependency-closure preflight, identity and dependency contract validation, optional schedule validation, iterative dependency-first loading, bounded arbitration, host handoff, and distinct failure boundaries. Connector motion is explanatory and honors reduced-motion preferences. It is a contract map, not a live execution trace.</desc><rect x="0" y="0" width="100" height="56.25" fill="#0b1725" id="background" /><defs id="definitions"><marker refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto" id="arrowhead"><polygon points="0,0 10,5 0,10" fill="#7ee0bd" id="arrowhead-shape" /></marker></defs><text x="3" y="3.2" fill="#eef6ff" id="heading" font-family="sans-serif" font-size="2.1" font-weight="700">FSM_COS  |  VALIDATION / COMPOSITION / HANDOFF</text><rect x="3" y="6" width="18" height="8" fill="#173b4c" rx="1" id="manifest-box" stroke="#7ee0bd" stroke-width="0.3" /><text x="12" y="10.5" fill="#eef6ff" id="manifest-label" font-family="sans-serif" font-size="1.45" text-anchor="middle">RuntimeManifest</text><rect x="25" y="6" width="20" height="8" fill="#173b4c" rx="1" id="roots-box" stroke="#7ee0bd" stroke-width="0.3" /><text x="35" y="9.4" fill="#eef6ff" id="roots-label" font-family="sans-serif" font-size="1.5" text-anchor="middle">Resolve root IDs</text><text x="35" y="11.5" fill="#d6e7f4" id="roots-sub-label" font-family="sans-serif" font-size="1.3" text-anchor="middle">and exact versions</text><rect x="49" y="6" width="22" height="8" fill="#302b58" rx="1" id="identity-box" stroke="#b9a7ff" stroke-width="0.3" /><text x="60" y="9.4" fill="#eef6ff" id="identity-label" font-family="sans-serif" font-size="1.4" text-anchor="middle">Validate bundle identity</text><text x="60" y="11.5" fill="#d6e7f4" id="identity-sub-label" font-family="sans-serif" font-size="1.05" text-anchor="middle">descriptor + dependency requests</text><rect x="75" y="6" width="22" height="8" fill="#302b58" rx="1" id="schedule-box" stroke="#b9a7ff" stroke-width="0.3" /><text x="86" y="9.4" fill="#eef6ff" id="schedule-label" font-family="sans-serif" font-size="1.35" text-anchor="middle">Optional schedule check</text><text x="86" y="11.5" fill="#d6e7f4" id="schedule-sub-label" font-family="sans-serif" font-size="1.25" text-anchor="middle">closure + edges</text><line x1="21" y1="10" x2="24" y2="10" stroke="#7ee0bd" stroke-width="0.45" id="manifest-to-roots" class="flow-line" marker-end="url(#arrowhead)" /><line x1="45" y1="10" x2="48" y2="10" stroke="#7ee0bd" stroke-width="0.45" id="roots-to-identity" class="flow-line" marker-end="url(#arrowhead)" /><line x1="71" y1="10" x2="74" y2="10" stroke="#7ee0bd" stroke-width="0.45" id="identity-to-schedule" class="flow-line" marker-end="url(#arrowhead)" /><rect x="75" y="21" width="22" height="8" fill="#173b4c" rx="1" id="load-box" stroke="#7ee0bd" stroke-width="0.3" /><text x="86" y="24.4" fill="#eef6ff" id="load-label" font-family="sans-serif" font-size="1.35" text-anchor="middle">Load dependencies first</text><text x="86" y="26.5" fill="#d6e7f4" id="load-sub-label" font-family="sans-serif" font-size="1.25" text-anchor="middle">then dependents</text><line x1="86" y1="14" x2="86" y2="20" stroke="#7ee0bd" stroke-width="0.45" id="schedule-to-load" class="flow-line" marker-end="url(#arrowhead)" /><rect x="49" y="21" width="22" height="8" fill="#173b4c" rx="1" id="arbitration-box" stroke="#7ee0bd" stroke-width="0.3" /><text x="60" y="24.4" fill="#eef6ff" id="arbitration-label" font-family="sans-serif" font-size="1.4" text-anchor="middle">Bounded arbitration</text><text x="60" y="26.5" fill="#d6e7f4" id="arbitration-sub-label" font-family="sans-serif" font-size="1.15" text-anchor="middle">stop when stable or fail</text><line x1="75" y1="25" x2="72" y2="25" stroke="#7ee0bd" stroke-width="0.45" id="load-to-arbitration" class="flow-line" marker-end="url(#arrowhead)" /><rect x="25" y="21" width="20" height="8" fill="#173b4c" rx="1" id="assembly-box" stroke="#7ee0bd" stroke-width="0.3" /><text x="35" y="24.4" fill="#eef6ff" id="assembly-label" font-family="sans-serif" font-size="1.4" text-anchor="middle">RuntimeAssembly</text><text x="35" y="26.5" fill="#d6e7f4" id="assembly-sub-label" font-family="sans-serif" font-size="1.25" text-anchor="middle">only on success</text><line x1="49" y1="25" x2="46" y2="25" stroke="#7ee0bd" stroke-width="0.45" id="arbitration-to-assembly" class="flow-line" marker-end="url(#arrowhead)" /><rect x="3" y="21" width="18" height="8" fill="#173b4c" rx="1" id="host-box" stroke="#7ee0bd" stroke-width="0.3" /><text x="12" y="24.4" fill="#eef6ff" id="host-label" font-family="sans-serif" font-size="1.25" text-anchor="middle">Host owns execution</text><text x="12" y="26.5" fill="#d6e7f4" id="host-sub-label" font-family="sans-serif" font-size="1.15" text-anchor="middle">FSM_COS hands off</text><line x1="25" y1="25" x2="22" y2="25" stroke="#7ee0bd" stroke-width="0.45" id="assembly-to-host" class="flow-line" marker-end="url(#arrowhead)" /><rect x="3" y="36" width="44" height="10" fill="#3a202c" rx="1" id="preflight-failure-box" stroke="#ff8c9d" stroke-width="0.3" /><text x="25" y="40" fill="#fff1f3" id="preflight-failure-label" font-family="sans-serif" font-size="1.5" font-weight="700" text-anchor="middle">Preflight rejection</text><text x="25" y="42.5" fill="#ffd5dc" id="preflight-failure-sub-label" font-family="sans-serif" font-size="1.15" text-anchor="middle">Bad identity, missing dependency, cycle, or schedule mismatch: reject before Load()</text><rect x="53" y="36" width="44" height="10" fill="#3a202c" rx="1" id="runtime-failure-box" stroke="#ff8c9d" stroke-width="0.3" /><text x="75" y="40" fill="#fff1f3" id="runtime-failure-label" font-family="sans-serif" font-size="1.5" font-weight="700" text-anchor="middle">Runtime failure</text><text x="75" y="42.5" fill="#ffd5dc" id="runtime-failure-sub-label" font-family="sans-serif" font-size="1.1" text-anchor="middle">Provider configuration / Load / arbitration / non-convergence: no assembly</text><line x1="60" y1="14" x2="46" y2="17" stroke="#ff8c9d" stroke-width="0.35" stroke-dasharray="0.7 0.5" id="identity-to-preflight-failure-diagonal" /><line x1="46" y1="17" x2="46" y2="35" stroke="#ff8c9d" stroke-width="0.35" stroke-dasharray="0.7 0.5" id="identity-to-preflight-failure-vertical" /><line x1="46" y1="35" x2="44" y2="36" stroke="#ff8c9d" stroke-width="0.35" stroke-dasharray="0.7 0.5" id="identity-to-preflight-failure-entry" /><line x1="60" y1="29" x2="60" y2="36" stroke="#ff8c9d" stroke-width="0.35" stroke-dasharray="0.7 0.5" id="arbitration-to-runtime-failure" /><text x="3" y="51.5" fill="#d6e7f4" id="stage-note" font-family="sans-serif" font-size="1.25">LoadPlan stages are metadata; they do not automatically defer loading. Load failures do not roll back prior side effects.</text><style>@keyframes fsm-cos-flow { to { stroke-dashoffset: -2.2; } }
.flow-line { stroke-dasharray: 0.75 0.45; animation: fsm-cos-flow 2.8s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .flow-line { animation: none !important; stroke-dasharray: none !important; }
}</style></svg>
