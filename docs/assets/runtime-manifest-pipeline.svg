<text x="70" y="475" fill="#8fa7bc" font-size="16">The manifest is intentionally smaller than the editor model.</text>
<text x="70" y="507" fill="#8fa7bc" font-size="16">It carries enough information for deterministic composition without becoming the assembled runtime.</text>
