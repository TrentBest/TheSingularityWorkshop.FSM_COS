<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b12"/><stop offset="1" stop-color="#101923"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172b38"/><stop offset="1" stop-color="#0b141d"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5a623"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker>
</defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<g opacity=".16" stroke="#63e6ff" stroke-width="1">
  <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/>
  <path d="M80 0V620M160 0V620M240 0V620M320 0V620M400 0V620M480 0V620M560 0V620M640 0V620M720 0V620M800 0V620M880 0V620M960 0V620M1040 0V620M1120 0V620"/>
</g>
<text x="70" y="62" fill="#63e6ff" font-family="monospace" font-size="27" letter-spacing="5">FSM_COS / WHAT IT IS</text>
<text x="70" y="92" fill="#8da6b8" font-family="monospace" font-size="14" letter-spacing="2">A COMPOSITION KERNEL BETWEEN REQUEST AND MANIFESTATION</text>

<g transform="translate(70 180)">
  <rect width="245" height="235" rx="12" fill="#0d1822" stroke="#2a5266" stroke-width="2"/>
  <text x="24" y="45" fill="#f2f7fa" font-family="monospace" font-size="20">AUTHORING</text>
  <text x="24" y="76" fill="#8da6b8" font-family="monospace" font-size="13">rich semantic intent</text>
  <text x="24" y="122" fill="#63e6ff" font-family="monospace" font-size="13">ontology</text>
  <text x="24" y="148" fill="#63e6ff" font-family="monospace" font-size="13">variants</text>
  <text x="24" y="174" fill="#63e6ff" font-family="monospace" font-size="13">dependency graph</text>
  <text x="24" y="200" fill="#63e6ff" font-family="monospace" font-size="13">configuration metadata</text>
</g>
<path d="M315 297H405" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>
<text x="330" y="275" fill="#8da6b8" font-family="monospace" font-size="12">PUBLISH</text>

<g transform="translate(405 145)">
  <rect width="390" height="305" rx="18" fill="url(#core)" stroke="#63e6ff" stroke-width="3"/>
  <rect x="18" y="18" width="354" height="42" rx="7" fill="#0a1118" stroke="#294a5c"/>
  <text x="195" y="46" text-anchor="middle" fill="#63e6ff" font-family="monospace" font-size="21" letter-spacing="3">FSM_COS</text>
  <text x="195" y="88" text-anchor="middle" fill="#f2f7fa" font-family="monospace" font-size="17">COMPOSITION KERNEL</text>
  <g font-family="monospace" font-size="13">
    <text x="45" y="132" fill="#f5c76a">01</text><text x="78" y="132" fill="#d7e3ea">resolve roots</text>
    <text x="45" y="164" fill="#f5c76a">02</text><text x="78" y="164" fill="#d7e3ea">close dependencies</text>
    <text x="45" y="196" fill="#f5c76a">03</text><text x="78" y="196" fill="#d7e3ea">accept external configuration</text>
    <text x="45" y="228" fill="#f5c76a">04</text><text x="78" y="228" fill="#d7e3ea">load / install</text>
    <text x="45" y="260" fill="#f5c76a">05</text><text x="78" y="260" fill="#d7e3ea">arbitrate to convergence</text>
  </g>
  <circle cx="340" cy="132" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="340" cy="164" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="340" cy="196" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="340" cy="228" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="340" cy="260" r="7" fill="#ffd166" filter="url(#glow)"/>
</g>

<path d="M795 297H885" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>
<text x="812" y="275" fill="#8da6b8" font-family="monospace" font-size="12">HAND OFF</text>

<g transform="translate(885 180)">
  <rect width="245" height="235" rx="12" fill="#0d1822" stroke="#2a5266" stroke-width="2"/>
  <text x="24" y="45" fill="#f2f7fa" font-family="monospace" font-size="20">HOST</text>
  <text x="24" y="76" fill="#8da6b8" font-family="monospace" font-size="13">receives RuntimeAssembly</text>
  <text x="24" y="122" fill="#63e6ff" font-family="monospace" font-size="13">WebForge</text>
  <text x="24" y="148" fill="#63e6ff" font-family="monospace" font-size="13">Unity</text>
  <text x="24" y="174" fill="#63e6ff" font-family="monospace" font-size="13">Desktop</text>
  <text x="24" y="200" fill="#63e6ff" font-family="monospace" font-size="13">other domains</text>
</g>

<g transform="translate(70 485)">
  <rect width="1060" height="72" rx="10" fill="#0a1118" stroke="#2a5266"/>
  <text x="530" y="30" text-anchor="middle" fill="#f5c76a" font-family="monospace" font-size="16">COMPOSITION ≠ EXECUTION ≠ MANIFESTATION</text>
  <text x="530" y="52" text-anchor="middle" fill="#8da6b8" font-family="monospace" font-size="12">FSM_COS assembles the requested system; it does not become the host that runs it.</text>
</g>
</svg>