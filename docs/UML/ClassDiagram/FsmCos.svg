<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">FSM_COS source-grounded class diagram: FsmCos</title>
  <desc id="desc">A namespace card with a thick blue border contains FsmCos and its nested LoadFrame. FsmCos implements IFsmCos, stores an IMicroBundleCatalog, accepts RuntimeManifest and optional IMicroBundleConfigurationSource in Execute, and returns RuntimeAssembly. RuntimeManifest and RuntimeAssembly use the domain IMicroBundle contract through the catalog and load context. Solid lines denote implementation or stored field; dashed lines denote method input/output or implementation flow, not ownership.</desc>
