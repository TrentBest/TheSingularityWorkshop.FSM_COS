<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Runtime manifest dependency schedule and load plan</title>
<desc id="desc">A source-grounded diagram showing RuntimeManifestEntry and RuntimeManifestDependency as inputs to RuntimeManifestSchedule. The schedule validates identities, edge endpoints, duplicate edges, and cycles, then exposes independent entries, dependency entries, and dependency readiness. RuntimeManifestLoadPlan consumes entries and an optional schedule, tracks Published, Localized, and Loaded states, requires dependencies to be loaded before marking a bundle loaded, and consults IManifestLoadEvaluator for deferred promotion decisions. The diagram explicitly says this is not a process scheduler and does not itself localize or load artifacts.</desc>
<defs><style>
.bg{fill:#f7faff}.ns{fill:#fff;stroke:#1769e0;stroke-width:8}.nshead{fill:#e6f0ff}.nslabel{font:700 21px system-ui,sans-serif;fill:#114ba6}.title{font:700 22px system-ui,sans-serif;fill:#142943}.body{font:15px ui-monospace,Consolas,monospace;fill:#193653}.small{font:15px system-ui,sans-serif;fill:#405873}.pill{font:700 14px system-ui,sans-serif;fill:#fff;letter-spacing:.4px}.card{stroke-width:2.5;rx:12}.record{fill:#f0e9ff;stroke:#7752c7}.edge{fill:none;stroke:#425b78;stroke-width:3}.flow{fill:none;stroke:#667b93;stroke-width:2.5;stroke-dasharray:9 7}.state{fill:#e8f7ef;stroke:#238653;stroke-width:2}.warning{fill:#fff3d9;stroke:#bd7900;stroke-width:2}.foot{font:14px system-ui,sans-serif;fill:#405873}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#425b78"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#667b93"/></marker></defs>
