<text x="55" y="66" class="nslabel">NAMESPACE / DATA CARD</text><text x="55" y="88" class="small">TheSingularityWorkshop.FSM_COS · publish-time planning + host-reported runtime availability</text>
<rect x="65" y="145" width="320" height="120" class="card record"/><rect x="65" y="145" width="320" height="36" rx="10" fill="#7752c7"/><text x="85" y="169" class="pill">INPUT RECORD</text><text x="85" y="208" class="title">RuntimeManifestEntry</text><text x="85" y="235" class="body">Reference + intended Stage</text><text x="85" y="254" class="body">IsValid</text>
<rect x="65" y="310" width="320" height="120" class="card record"/><rect x="65" y="310" width="320" height="36" rx="10" fill="#7752c7"/><text x="85" y="334" class="pill">INPUT RECORD</text><text x="85" y="373" class="title">RuntimeManifestDependency</text><text x="85" y="400" class="body">BundleId requires DependencyId</text><text x="85" y="419" class="body">Nonzero · not self-edge</text>
<rect x="465" y="160" width="500" height="300" class="card" fill="#e4f5ff" stroke="#087ca7"/><rect x="465" y="160" width="500" height="40" rx="10" fill="#087ca7"/><text x="485" y="186" class="pill">PUBLISH-TIME DEPENDENCY ANALYSIS</text><text x="485" y="228" class="title">RuntimeManifestSchedule</text><text x="485" y="258" class="body">Entries · Dependencies (read-only snapshots)</text><text x="485" y="288" class="body">IndependentEntries · DependencyEntries</text><text x="485" y="318" class="body">DependenciesOf(bundleId)</text><text x="485" y="348" class="body">IsDependencyReady(bundleId, isLoaded)</text><line x1="485" y1="365" x2="940" y2="365" stroke="#9cc9d8" stroke-width="1.5"/><text x="485" y="393" class="small">Bounds inputs; validates identities, edge endpoints,</text><text x="485" y="416" class="small">duplicate edges and cycles before exposing the plan.</text><text x="485" y="441" class="small">Not a process scheduler.</text>
<path d="M385 205 H465" class="flow" marker-end="url(#b)"/><path d="M385 370 H465" class="flow" marker-end="url(#b)"/>
<rect x="1050" y="155" width="310" height="120" class="card warning"/><text x="1070" y="188" class="title">Host / repository</text><text x="1070" y="216" class="body">localizes artifact bytes</text><text x="1070" y="241" class="body">performs actual loading</text><text x="1070" y="262" class="small">Outside schedule / load-plan types</text>
<rect x="465" y="520" width="500" height="235" class="card" fill="#e8f7ef" stroke="#238653"/><rect x="465" y="520" width="500" height="40" rx="10" fill="#238653"/><text x="485" y="546" class="pill">RUNTIME AVAILABILITY TRACKER</text><text x="485" y="590" class="title">RuntimeManifestLoadPlan</text><text x="485" y="620" class="body">Entries + optional validated schedule</text><text x="485" y="650" class="body">GetState · MarkLocalized · MarkLoaded</text><text x="485" y="680" class="body">EvaluatePromotions(evaluator, context, schedule?)</text><text x="485" y="716" class="small">Construction does not localize or load anything.</text>
