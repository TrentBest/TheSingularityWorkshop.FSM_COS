<rect x="1050" y="350" width="310" height="120" class="card record"/><rect x="1050" y="350" width="310" height="36" rx="10" fill="#7752c7"/><text x="1070" y="374" class="pill">EXPERIENCE DECISION</text><text x="1070" y="414" class="title">IManifestLoadEvaluator</text><text x="1070" y="442" class="body">ShouldLoad(entry, context)</text><text x="1070" y="461" class="small">Deferred-entry promotion only</text>
<path d="M1050 410 H1000 V690 H965" class="flow" marker-end="url(#b)"/><text x="1015" y="510" class="small" transform="rotate(90 1015 510)">consults for deferred entries</text>
<rect x="1050" y="535" width="310" height="220" rx="12" fill="#fff" stroke="#9bb0c8" stroke-width="2"/><text x="1070" y="570" class="title">Tracked state</text><rect x="1070" y="590" width="270" height="38" rx="8" class="state"/><text x="1205" y="614" text-anchor="middle" class="body">Published</text><path d="M1205 628 V650" class="edge" marker-end="url(#a)"/><rect x="1070" y="650" width="270" height="38" rx="8" class="state"/><text x="1205" y="674" text-anchor="middle" class="body">Localized</text><path d="M1205 688 V710" class="edge" marker-end="url(#a)"/><rect x="1070" y="710" width="270" height="32" rx="8" class="state"/><text x="1205" y="731" text-anchor="middle" class="body">Loaded</text>
<rect x="65" y="500" width="320" height="255" rx="14" fill="#edf3fa" stroke="#a8bad0" stroke-width="1.5"/><text x="85" y="535" class="title">Important distinctions</text><text x="85" y="568" class="small">1. Dependency edge:</text><text x="105" y="590" class="body">Bundle → prerequisite</text><text x="85" y="622" class="small">2. Loaded requires:</text><text x="105" y="644" class="body">localized + prerequisites loaded</text><text x="85" y="676" class="small">3. Deferred promotion:</text><text x="105" y="698" class="body">evaluator + experience context</text><text x="85" y="730" class="small">No implicit byte loading.</text>
<text x="720" y="815" text-anchor="middle" class="foot">Static source-derived diagram · not a live trace · manually authored · no SVG render/build/test verification claimed</text>
