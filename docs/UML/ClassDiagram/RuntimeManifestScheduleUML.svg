<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" role="img" aria-labelledby="title desc">
<title id="title">RuntimeManifestSchedule consumer-first data-card diagram</title>
<desc id="desc">A manifest publisher or host sits above the centered RuntimeManifestSchedule focal type and supplies entries and dependency edges. The schedule validates the dependency graph and exposes dependency readiness. RuntimeManifestLoadPlan sits below as an optional consumer of the validated schedule; the host or repository remains responsible for actual localization and loading.</desc>
<defs><style>
.bg{fill:#f7faff}.ns{fill:#fff;stroke:#1769e0;stroke-width:7}.nshead{fill:#e6f0ff}.nslabel{font:700 18px system-ui,sans-serif;fill:#114ba6}.title{font:700 22px system-ui,sans-serif;fill:#142943}.body{font:15px ui-monospace,Consolas,monospace;fill:#193653}.small{font:15px system-ui,sans-serif;fill:#405873}.pill{font:700 13px system-ui,sans-serif;fill:#fff;letter-spacing:.4px}.card{stroke-width:3;rx:14}.consumer{fill:#fff3d9;stroke:#bd7900}.focal{fill:#e4f5ff;stroke:#087ca7}.input{fill:#f0e9ff;stroke:#7752c7}.runtime{fill:#e8f7ef;stroke:#238653}.warning{fill:#fff3d9;stroke:#bd7900}.edge{fill:none;stroke:#425b78;stroke-width:3.5}.label{font:700 14px system-ui,sans-serif;fill:#354f6c}.legend{font:14px system-ui,sans-serif;fill:#405873}
</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11z" fill="#425b78"/></marker></defs>
<rect class="bg" width="1160" height="900"/>
<rect x="365" y="28" width="430" height="104" class="card consumer"/><rect x="365" y="28" width="430" height="33" rx="12" fill="#bd7900"/><text x="386" y="50" class="pill">CONSUMER / PUBLISHER</text><text x="386" y="84" class="title">Manifest publisher / host</text><text x="386" y="109" class="small">Provides published entries and dependency edges</text>
<path d="M580 132 V207" class="edge" marker-end="url(#arrow)"/><text x="596" y="175" class="label">constructs / consumes</text>
<rect x="230" y="205" width="700" height="390" rx="18" class="ns"/><path d="M234 227 Q234 209 252 209 H908 Q926 209 926 227 V258 H234Z" class="nshead"/><text x="255" y="232" class="nslabel">NAMESPACE / OWNERSHIP CARD</text><text x="255" y="251" class="small">TheSingularityWorkshop.FSM_COS</text>
<rect x="350" y="280" width="460" height="275" class="card focal"/><rect x="350" y="280" width="460" height="40" rx="12" fill="#087ca7"/><text x="370" y="306" class="pill">FOCAL TYPE · VALIDATED DEPENDENCY GRAPH</text><text x="370" y="357" class="title">RuntimeManifestSchedule</text><line x1="370" y1="374" x2="790" y2="374" stroke="#9cc9d8" stroke-width="1.5"/><text x="370" y="404" class="body">Entries · Dependencies</text><text x="370" y="432" class="body">IndependentEntries · DependencyEntries</text><text x="370" y="460" class="body">DependenciesOf(bundleId)</text><text x="370" y="488" class="body">IsDependencyReady(bundleId, isLoaded)</text><line x1="370" y1="505" x2="790" y2="505" stroke="#9cc9d8" stroke-width="1.5"/><text x="370" y="530" class="small">Validates identities, edges, duplicates, and cycles</text>
<rect x="25" y="300" width="180" height="115" class="card input"/><rect x="25" y="300" width="180" height="32" rx="12" fill="#7752c7"/><text x="42" y="322" class="pill">INPUT RECORD</text><text x="42" y="363" class="title" style="font-size:17px">ManifestEntry</text><text x="42" y="390" class="small">Identity + stage</text><path d="M205 356 H350" class="edge" marker-end="url(#arrow)"/><text x="277" y="341" text-anchor="middle" class="label">entries</text>
<rect x="955" y="300" width="180" height="115" class="card input"/><rect x="955" y="300" width="180" height="32" rx="12" fill="#7752c7"/><text x="972" y="322" class="pill">INPUT EDGE</text><text x="972" y="363" class="title" style="font-size:17px">Dependency</text><text x="972" y="390" class="small">Bundle requires bundle</text><path d="M955 356 H810" class="edge" marker-end="url(#arrow)"/><text x="882" y="341" text-anchor="middle" class="label">edges</text>
<path d="M580 595 V665" class="edge" marker-end="url(#arrow)"/><text x="597" y="635" class="label">optional input to</text>
<rect x="340" y="665" width="480" height="105" class="card runtime"/><rect x="340" y="665" width="480" height="34" rx="12" fill="#238653"/><text x="360" y="688" class="pill">OPTIONAL DOWNSTREAM CONSUMER</text><text x="360" y="729" class="title">RuntimeManifestLoadPlan</text><text x="360" y="753" class="small">Uses dependency readiness when tracking loaded state</text>
<rect x="850" y="665" width="285" height="105" class="card warning"/><text x="870" y="698" class="title" style="font-size:18px">Host / repository</text><text x="870" y="726" class="small">Fetches bytes and performs</text><text x="870" y="747" class="small">actual localization / loading</text>
<text x="30" y="835" class="legend">Reading order: publisher ↓ schedule → validated graph → optional load-plan use.</text><text x="30" y="859" class="legend">The schedule is not a process scheduler and does not fetch or load artifacts.</text>
</svg>