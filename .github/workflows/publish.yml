name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_COS.sln

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_COS.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/FSM_COS.Tests/FSM_COS.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/FSM_COS/FSM_COS.csproj
          --configuration Release
          --no-build
          --output ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
