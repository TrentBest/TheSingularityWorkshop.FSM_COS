name: CiAi Commit Evidence

on:
  push:
    branches: [development, master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ciai-commit-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe the completed package workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned CiAi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: ad404f7948b2a57bf75e92eec7d4fb288270e6ae
          path: _tools/CiAi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build and verify the pinned CiAi contract
        working-directory: _tools/CiAi
        run: |
          dotnet restore CiAi.slnx
          dotnet build CiAi.slnx --configuration Release --no-restore
          dotnet run --project tests/TheSingularityWorkshop.CiAi.ContractTests --configuration Release --no-build

      - name: Observe the exact completed package workflow run
        shell: bash
        env:
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_run_id=""
          benchmark_run_id=""
          package_state=""
          benchmark_state=""
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$TARGET_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
            package_run_id="$(jq -r --arg sha "$TARGET_SHA" --arg branch "$TARGET_BRANCH" '
              [.workflow_runs[] | select(
                (.path | split("@")[0]) == ".github/workflows/package.yml" and
                (.head_sha | ascii_downcase) == ($sha | ascii_downcase) and
                .event == "push" and .head_branch == $branch
              )] | sort_by(.run_number) | last | .id // empty
            ' <<< "$runs")"
            benchmark_run_id="$(jq -r --arg sha "$TARGET_SHA" --arg branch "$TARGET_BRANCH" '
              [.workflow_runs[] | select(
                (.path | split("@")[0]) == ".github/workflows/benchmarks.yml" and
                (.head_sha | ascii_downcase) == ($sha | ascii_downcase) and
                .event == "push" and .head_branch == $branch
              )] | sort_by(.run_number) | last | .id // empty
            ' <<< "$runs")"

            package_state="missing"
            benchmark_state="missing"
            if [[ -n "$package_run_id" ]]; then
              package_state="$(gh api "repos/$TARGET_REPOSITORY/actions/runs/$package_run_id" --jq '.status')"
            fi
            if [[ -n "$benchmark_run_id" ]]; then
              benchmark_state="$(gh api "repos/$TARGET_REPOSITORY/actions/runs/$benchmark_run_id" --jq '.status')"
            fi
            if [[ "$package_state" == "completed" && "$benchmark_state" == "completed" ]]; then
              break
            fi
            echo "Waiting for required package and benchmark workflows (attempt $attempt/90; package=$package_state, benchmark=$benchmark_state)..."
            sleep 30
          done
          if [[ -n "$package_run_id" ]]; then
            package_attempt="$(gh api "repos/$TARGET_REPOSITORY/actions/runs/$package_run_id" --jq '.run_attempt')"
            package_selector=".github/workflows/package.yml#$package_run_id#$package_attempt"
          else
            package_selector=".github/workflows/package.yml#missing"
          fi
          if [[ -n "$benchmark_run_id" ]]; then
            benchmark_attempt="$(gh api "repos/$TARGET_REPOSITORY/actions/runs/$benchmark_run_id" --jq '.run_attempt')"
            benchmark_selector=".github/workflows/benchmarks.yml#$benchmark_run_id#$benchmark_attempt"
          else
            benchmark_selector=".github/workflows/benchmarks.yml#missing"
          fi
          if [[ "$package_state" != "completed" || "$benchmark_state" != "completed" ]]; then
            echo "Required package and/or benchmark workflow did not reach a terminal state within the bounded wait; preserving a failing observation report."
          fi
          export CIAI_REQUIRED_WORKFLOW_PATHS="$package_selector;$benchmark_selector"
          mkdir -p artifacts
          dotnet run --project _tools/CiAi/samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- "$TARGET_REPOSITORY" "$TARGET_SHA" artifacts/commit-observation.json
          jq -e --arg repo "$TARGET_REPOSITORY" --arg sha "$TARGET_SHA" --arg package_id "$package_run_id" --arg package_attempt "$package_attempt" --arg benchmark_id "$benchmark_run_id" --arg benchmark_attempt "$benchmark_attempt" '
            .schema == "ciai.commit-observation.v2" and
            (.repository | ascii_downcase) == ($repo | ascii_downcase) and
            (.headSha | ascii_downcase) == ($sha | ascii_downcase) and
            .discoveryComplete == true and
            .complete == true and
            (.requiredWorkflowResults | length) == 2 and
            ([.requiredWorkflowResults[].State] | all(. == "passed")) and
            ([.requiredWorkflowResults[].WorkflowPath] | index(".github/workflows/package.yml#" + $package_id + "#" + $package_attempt)) != null and
            ([.requiredWorkflowResults[].WorkflowPath] | index(".github/workflows/benchmarks.yml#" + $benchmark_id + "#" + $benchmark_attempt)) != null
          ' artifacts/commit-observation.json

      - name: Upload CiAi observation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ciai-commit-observation-${{ github.sha }}
          path: |
            artifacts/commit-observation.json
            artifacts/commit-observation.md
          if-no-files-found: warn
          retention-days: 14
